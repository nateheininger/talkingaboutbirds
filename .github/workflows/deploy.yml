name: Build and deploy

on:
  push:
    branches: [main]
  # Check the podcast feed every 2 hours; rebuild only when it changed.
  # Also rebuild every morning after the private stats repo updates (12:00 UTC) so /stats/ is fresh.
  schedule:
    - cron: '23 */2 * * *'
    - cron: '40 12 * * *'
  # "Run workflow" button in the Actions tab forces a rebuild.
  workflow_dispatch:

permissions:
  contents: write # commit src/data/feed-state.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the feed for changes
        id: feed
        run: node scripts/check-feed.mjs

      - name: Decide whether to deploy
        id: decide
        run: echo "deploy=${{ github.event_name != 'schedule' || github.event.schedule == '40 12 * * *' || steps.feed.outputs.changed == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Record the new feed state
        if: steps.feed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/feed-state.json
          git commit -m "Feed update: $(node -p "require('./src/data/feed-state.json').latestTitle")"
          git pull --rebase && git push

      # The stats dashboard data lives in the private tab-metrics repo. A read-only deploy key
      # fetches just data/dashboard.json; the /stats/ page is encrypted before publishing.
      # If this fails the site still deploys, with a placeholder on /stats/.
      - name: Get stats data
        if: steps.decide.outputs.deploy == 'true'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: nateheininger/tab-metrics
          ssh-key: ${{ secrets.METRICS_DEPLOY_KEY }}
          path: .metrics
          sparse-checkout: data/dashboard.json
          sparse-checkout-cone-mode: false

      - run: npm ci
        if: steps.decide.outputs.deploy == 'true'

      - name: Build
        if: steps.decide.outputs.deploy == 'true'
        env:
          # Set the SITE_URL repository variable to https://talkingaboutbirds.com once DNS points here.
          # Until then the site builds for https://<owner>.github.io/<repo>/.
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.SITE_URL && '/' || format('/{0}', github.event.repository.name) }}
          METRICS_DIR: .metrics
          STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        if: steps.decide.outputs.deploy == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
